<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimedia Player</title>
</head>
<body>
     <h1>Multimedia Player</h1>

  <section>
    <h2>Now Playing: Audio</h2>
    <audio controls aria-label="Audio player">
      <source src="https://cdn.freecodecamp.org/curriculum/js-music-player/sailing-away.mp3" type="audio/mpeg">
    </audio>
  </section>

  <section>
    <h2>Now Playing: Video</h2>
    <video controls width="640" aria-label="Video player">
      <source src="https://cdn.freecodecamp.org/curriculum/labs/what-is-the-map-method-and-how-does-it-work.mp4" type="video/mp4">
      <track
        src="https://cdn.freecodecamp.org/curriculum/labs/what-is-the-map-method-and-how-does-it-work.vtt"
        kind="captions"
        srclang="en"
        label="English">
    </video>
  </section>
  <section>
    <h2>Transcript</h2>
    <p>this is very helpful video</p>
  </section>
</body>
</html>

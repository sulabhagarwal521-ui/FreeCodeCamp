<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 id="title">Survey Form</h1>
<p id="description">Thank you for taking the time to help us improve!</p>

<form id="survey-form">
  <label id="name-label" for="name">Name</label>
  <input id="name" type="text" placeholder="Enter your name" required>

  <label id="email-label" for="email">Email</label>
  <input id="email" type="email" placeholder="Enter your email" required>

  <label id="number-label" for="number">Age</label>
  <input id="number" type="number" min="10" max="100" placeholder="Age">

  <label for="dropdown">Which option best describes you?</label>
  <select id="dropdown">
    <option value="">Select an option</option>
    <option value="student">Student</option>
    <option value="job">Full-time job</option>
  </select>

  <p>Would you recommend FreeCodeCamp to a friend?</p>
  <label>
    <input type="radio" name="recommend" value="yes"> Definitely
  </label>
  <label>
    <input type="radio" name="recommend" value="maybe"> Maybe
  </label>
  <label>
    <input type="radio" name="recommend" value="no"> Not sure
  </label>

  <p>What would you like to learn?</p>
  <label>
    <input type="checkbox" value="html"> HTML
  </label>
  <label>
    <input type="checkbox" value="css"> CSS
  </label>
  <label>
    <input type="checkbox" value="javascript"> JavaScript
  </label>

  <label for="comments">Any comments or suggestions?</label>
  <textarea id="comments" placeholder="Enter your comments here"></textarea>

  <button id="submit" type="submit">Submit</button>
</form>
</body>
</html>

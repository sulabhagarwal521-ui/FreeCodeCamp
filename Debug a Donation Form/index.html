<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donation Form</title>
</head>
<body>
    <h1>Donation Form</h1>
  <form>
    
    <label for="name"id="name">Full Name:</label>
    <input type="text"id="name"name="name"required>

    <label for="email"id="email">Email Address:</label>
    <input type="email"id="email" name="email"required>

    <label for="number"id="number">Donation Amount ($):</label>
    <input type="number"id="number" name="amount"required>

    <label for="newsletter"id="newsletter">Subscribe</label>
    <input type="checkbox"id="newsletter"name="newsletter">

    <input type="submit" value="Send">
  </form>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Business Card</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="business-card">
    <img class="profile-image" src="https://cdn.freecodecamp.org/curriculum/labs/flower.jpg" alt="profile picture">
    <p class="full-name">Sulabh Agarwal</p>
    <p class="designation">Web Developer</p>
    <p class="company">Creative Solutions</p>
    <hr>
    <p>Email: sulabh@example.com</p>
    <p>Phone: 123456789</p>
    <a class="portfolio-link" href="https://www.github.com" target="_blank">Portfolio</a>
    <hr>
    <div class="social-media">
      <h2>Connect with me</h2>
      <a href="https://www.twitter.com">Twitter</a>
      <a href="https://www.linkedin.com">LinkedIn</a>
      <a href="https://www.Github.com">GitHub</a>
      </div>
    </div>
</body>

</html>
